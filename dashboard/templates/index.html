<!DOCTYPE html>
<html>

<head>

<title>Business Intelligence Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: Arial;
background:#f4f6f9;
margin:40px;
}

h1{
text-align:center;
}

.cards{
display:flex;
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
flex:1;
text-align:center;
}

</style>

</head>

<body>

<h1>Real-Time Business Intelligence Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Total Transactions</h3>
<h2 id="transactions"></h2>
</div>

<div class="card">
<h3>Total Revenue</h3>
<h2 id="revenue"></h2>
</div>

<div class="card">
<h3>Average Transaction</h3>
<h2 id="average"></h2>
</div>

</div>

<canvas id="categoryChart"></canvas>

<h2>Anomaly Transactions</h2>
<table border="1" cellpadding="10">
<thead>
<tr>
<th>ID</th>
<th>Amount</th>
<th>Category</th>
</tr>
</thead>
<tbody id="anomalyTable"></tbody>
</table>

<script>

let chart;

async function loadData(){

const response = await fetch("/data");
const data = await response.json();

document.getElementById("transactions").innerText = data.total_transactions;
document.getElementById("revenue").innerText = data.total_revenue;
document.getElementById("average").innerText = data.avg_transaction;

let labels = Object.keys(data.category_sales);
let values = Object.values(data.category_sales);

if(chart){
chart.destroy();
}

chart = new Chart(
document.getElementById("categoryChart"),
{
type:"bar",
data:{
labels:labels,
datasets:[{
label:"Sales by Category",
data:values
}]
}
}
);

let table="";
data.anomalies.forEach(a=>{
table+=`<tr>
<td>${a.Transaction_ID}</td>
<td>${a.Amount}</td>
<td>${a.Category}</td>
</tr>`;
});

document.getElementById("anomalyTable").innerHTML=table;

}

setInterval(loadData,3000);
loadData();

</script>

</body>

</html>
