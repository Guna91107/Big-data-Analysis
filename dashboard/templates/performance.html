<!DOCTYPE html>
<html>

<head>

<title>System Performance</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#eef1f5;
margin:40px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.cards{
display:flex;
gap:20px;
margin-bottom:30px;
justify-content:center;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
text-align:center;
width:200px;
}

.chart-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
margin-bottom:30px;
}

button{
padding:10px 20px;
background:#4a6cf7;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#2f4fd8;
}

</style>

</head>

<body>

<h1>System Performance Monitoring</h1>

<div class="cards">

<div class="card">
<h3>CPU Usage</h3>
<h2 id="cpuValue">0%</h2>
</div>

<div class="card">
<h3>Memory Usage</h3>
<h2 id="memoryValue">0%</h2>
</div>

</div>

<div class="chart-box">
<canvas id="cpuChart"></canvas>
</div>

<div class="chart-box">
<canvas id="memoryChart"></canvas>
</div>

<center>
<button onclick="location.href='/'">Back to Dashboard</button>
</center>

<script>

let cpuChart
let memoryChart

let cpuData=[]
let memoryData=[]
let labels=[]

async function load(){

const res = await fetch("/data")
const data = await res.json()

let cpu=data.performance.cpu
let memory=data.performance.memory

document.getElementById("cpuValue").innerText=cpu+"%"
document.getElementById("memoryValue").innerText=memory+"%"

cpuData.push(cpu)
memoryData.push(memory)
labels.push(labels.length)

if(cpuData.length>20){
cpuData.shift()
memoryData.shift()
labels.shift()
}

if(cpuChart) cpuChart.destroy()

cpuChart = new Chart(
document.getElementById("cpuChart"),
{
type:"line",
data:{
labels:labels,
datasets:[{
label:"CPU Usage %",
data:cpuData,
borderColor:"blue"
}]
}
}
)

if(memoryChart) memoryChart.destroy()

memoryChart = new Chart(
document.getElementById("memoryChart"),
{
type:"line",
data:{
labels:labels,
datasets:[{
label:"Memory Usage %",
data:memoryData,
borderColor:"green"
}]
}
}
)

}

setInterval(load,3000)
load()

</script>

</body>
</html>
